name: Validate Zip Game Levels

on:
  push:
    branches:
      - main
    paths:
      - "levels.json"
      - "validate_levels.py"
      - ".github/workflows/validate-levels.yml"

  pull_request:
    paths:
      - "levels.json"
      - "validate_levels.py"
      - ".github/workflows/validate-levels.yml"

  workflow_dispatch:

jobs:
  validate:
    name: Validate Levels
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate levels.json
        run: python validate_levels.py levels.json
